site_name: TabletopCardEngine
site_description: A .NET class library modelling Texas Hold'em cash games
repo_url: https://github.com/DigitalAbsurd/TabletopCardEngine
repo_name: DigitalAbsurd/TabletopCardEngine
edit_uri: edit/main/docs/
copyright: Copyright 2025-2026 Mikhail Khrapunov. Licensed under Apache-2.0.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, '']

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - scheme: light
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: dark
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

exclude_docs: |
  task-run.md
  tasks-planning.md
  requirements.txt

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  not_found: warn

