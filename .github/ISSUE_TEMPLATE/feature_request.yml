name: Feature request
description: Suggest an improvement or new feature
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        **v1 scope:** No-Limit Hold'em cash games, 2 to 6 seats, no antes, no rake. Features outside v1 are tracked in [docs/roadmap.md](https://github.com/miekhra/OpenHoldemEngine/blob/main/docs/roadmap.md) for later releases.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, or what use case does it enable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you have thought of?
