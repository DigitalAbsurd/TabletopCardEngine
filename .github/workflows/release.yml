name: Release

# This workflow runs only when a release tag `v*` is pushed. Checks are run locally before every
# merge (docs/task-run.md), so nothing runs on a pull request or on a push to main.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Full history: MinVer reads the version from the tags, and a shallow checkout finds none.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build

      - name: Check formatting
        run: dotnet format TabletopCardEngine.sln --verify-no-changes

      - name: Run tests
        env:
          OHE_TEST_PHH_HAND_LIMIT: 100
        run: dotnet test

      - name: Check the public API against the baseline
        run: dotnet pack TabletopCardEngine.Packages.slnf -c Release -o _packages

      - name: Check the package version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "_packages/TabletopCardEngine.$version.nupkg" ]; then
            echo "::error::Expected _packages/TabletopCardEngine.$version.nupkg (tag $GITHUB_REF_NAME); MinVer produced:"
            ls _packages
            exit 1
          fi

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/TabletopCardEngine.Demo.BrowserTests/*.csproj') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pwsh tests/TabletopCardEngine.Demo.BrowserTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # The cache holds the browser only; the system packages it needs are not cached.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pwsh tests/TabletopCardEngine.Demo.BrowserTests/bin/Debug/net10.0/playwright.ps1 install-deps chromium

      - name: Run browser layout gate
        env:
          OHE_TEST_BROWSER_GATE: "1"
        run: dotnet test tests/TabletopCardEngine.Demo.BrowserTests

  # PostgreSQL and SQL Server in Docker through Testcontainers (docs/task-run.md, fact 28). Kept out of
  # the build job, which is already the slowest thing in the workflow. It runs on every release tag.
  providers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Run provider tests on PostgreSQL and SQL Server
        env:
          OHE_TEST_CONTAINERS: "1"
        run: dotnet run --project tests/TabletopCardEngine.Tests -c Release -- --filter "FullyQualifiedName~Persistence|FullyQualifiedName~MultiHandSession|FullyQualifiedName~ConcurrencyTests"

  # The three images of the Dockerfile, built with the release version. They are not pushed:
  # publishing to Docker Hub is a placeholder until the repository is public.
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [sqlite, postgres, mssql]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the ${{ matrix.target }} image
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build --target "${{ matrix.target }}" --build-arg VERSION="$version" \
            -t "tabletopcardengine:$version-${{ matrix.target }}" .

      - name: Check the image version label
        run: |
          version="${GITHUB_REF_NAME#v}"
          label=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "tabletopcardengine:$version-${{ matrix.target }}")
          if [ "$label" != "$version" ]; then
            echo "::error::Image label is '$label', expected '$version'"
            exit 1
          fi

  # Creates the GitHub Release: the notes from git-cliff and the .nupkg files. Images are built only,
  # and NuGet and Docker Hub publishing are placeholders. Only this job may write to the repository.
  release:
    needs: [build, providers, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Full history: MinVer needs the tag and git-cliff needs the commits.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      # The solution filter leaves the demo out, so no wasm workload is needed.
      - name: Pack
        run: dotnet pack TabletopCardEngine.Packages.slnf -c Release -o artifacts

      - name: Check every package carries the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected=$(jq '.solution.projects | length' TabletopCardEngine.Packages.slnf)
          packages=(artifacts/*.nupkg)
          bad=0
          if [ "${#packages[@]}" -ne "$expected" ]; then
            bad=1
          fi
          for package in "${packages[@]}"; do
            case "$package" in
              *".$version.nupkg") ;;
              *) bad=1 ;;
            esac
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::Expected $expected packages ending in .$version.nupkg (tag $GITHUB_REF_NAME); found ${#packages[@]}:"
            ls artifacts
            exit 1
          fi
          echo "${#packages[@]} packages carry version $version"

      - name: Release notes
        run: |
          npx --yes git-cliff@2.14.2 --latest --strip all -o release-notes.md
          test -s release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg             --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag $prerelease

  # The demo is deployed for a stable release only (no `-` in the tag). It is a called workflow
  # because a release created with GITHUB_TOKEN would not trigger one.
  deploy-demo:
    needs: [build, providers]
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-demo.yml

  # Placeholder: publishing to nuget.org starts with the milestone "v1.0 · NuGet packages & public launch",
  # once the repository is public. It will use NuGet Trusted Publishing (OIDC, no long-lived API key):
  # the NuGet/login action exchanges the job's id-token for a short-lived key, then
  # `dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json` runs on the
  # packages the release job built. To enable it: set OHE_PUBLISH to 'enabled', add the steps, and
  # register this workflow as a trusted publisher on nuget.org. The repository variable is not set.
  publish-nuget:
    needs: [release]
    if: ${{ vars.OHE_PUBLISH == 'enabled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Publish to nuget.org (placeholder)
        run: echo "::notice::NuGet publishing is not enabled yet (milestone v1.0 · NuGet packages & public launch)."

  # Placeholder: publishing the three images to Docker Hub starts with the same milestone. It will
  # log in with the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets, then push
  # <namespace>/tabletopcardengine:<version>-<target>, and also :<target> for a stable tag.
  # The repository variable is not set.
  publish-docker:
    needs: [release, docker]
    if: ${{ vars.OHE_PUBLISH == 'enabled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publish to Docker Hub (placeholder)
        run: echo "::notice::Docker Hub publishing is not enabled yet (milestone v1.0 · NuGet packages & public launch)."
