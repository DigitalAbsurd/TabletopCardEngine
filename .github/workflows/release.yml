name: Release

# This workflow runs only when a release tag `v*` is pushed. Checks are run locally before every
# merge (docs/task-run.md), so nothing runs on a pull request or on a push to main.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the release tag signature
        run: bash eng/verify-tag.sh "${{ github.ref_name }}"

  build:
    needs: [verify-tag]
    runs-on: ubuntu-latest

    steps:
      # Full history: MinVer reads the version from the tags, and a shallow checkout finds none.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build

      - name: Check formatting
        run: dotnet format TabletopCardEngine.sln --verify-no-changes

      - name: Run tests
        env:
          TCE_TEST_PHH_HAND_LIMIT: 100
        run: dotnet test

      - name: Check the public API against the baseline
        run: dotnet pack TabletopCardEngine.Packages.slnf -c Release -o _packages

      - name: Check every package carries the tag's version
        run: bash eng/verify-packages.sh _packages "${GITHUB_REF_NAME#v}"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/TabletopCardEngine.Demo.BrowserTests/*.csproj') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pwsh tests/TabletopCardEngine.Demo.BrowserTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # The cache holds the browser only; the system packages it needs are not cached.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pwsh tests/TabletopCardEngine.Demo.BrowserTests/bin/Debug/net10.0/playwright.ps1 install-deps chromium

      - name: Run browser layout gate
        env:
          TCE_TEST_BROWSER_GATE: "1"
        run: dotnet test tests/TabletopCardEngine.Demo.BrowserTests

  # PostgreSQL and SQL Server in Docker through Testcontainers (docs/task-run.md, fact 28). Kept out of
  # the build job, which is already the slowest thing in the workflow. It runs on every release tag.
  providers:
    needs: [verify-tag]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Run provider tests on PostgreSQL and SQL Server
        env:
          TCE_TEST_CONTAINERS: "1"
        run: dotnet run --project tests/TabletopCardEngine.Tests -c Release -- --filter "FullyQualifiedName~Persistence|FullyQualifiedName~MultiHandSession|FullyQualifiedName~ConcurrencyTests"

  # The three images of the Dockerfile, built with the release version. They are not pushed:
  # publishing to Docker Hub is a placeholder until the repository is public.
  docker:
    needs: [verify-tag]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [sqlite, postgres, mssql]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the ${{ matrix.target }} image
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build --target "${{ matrix.target }}" --build-arg VERSION="$version" \
            -t "tabletopcardengine:$version-${{ matrix.target }}" .

      - name: Check the image version label
        run: |
          version="${GITHUB_REF_NAME#v}"
          label=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "tabletopcardengine:$version-${{ matrix.target }}")
          if [ "$label" != "$version" ]; then
            echo "::error::Image label is '$label', expected '$version'"
            exit 1
          fi

  # The four stages below are reusable workflows, each also runnable by hand for an existing tag
  # (`gh workflow run <file> -f tag=vX.Y.Z`, docs/release-process.md). They are called with `uses:`
  # because a release created with GITHUB_TOKEN would not trigger another workflow. A called workflow
  # gets no more permissions than its caller job grants.

  # The GitHub Release with the git-cliff notes. It carries no packages. Only this job may write to
  # the repository.
  create-release:
    needs: [build, providers, docker]
    permissions:
      contents: write
    uses: ./.github/workflows/create-release.yml
    with:
      tag: ${{ github.ref_name }}

  # The demo is deployed for a stable release only (no `-` in the tag). It does not wait for the
  # GitHub Release.
  deploy-demo:
    needs: [build, providers]
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-demo.yml
    with:
      tag: ${{ github.ref_name }}

  # Placeholder until the milestone "v1.0 · NuGet packages & public launch"; gated by TCE_PUBLISH
  # inside the called workflow.
  publish-nuget:
    needs: [create-release]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-nuget.yml
    with:
      tag: ${{ github.ref_name }}

  # Placeholder until the same milestone; gated by TCE_PUBLISH inside the called workflow.
  publish-docker:
    needs: [create-release]
    permissions:
      contents: read
    uses: ./.github/workflows/publish-docker.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
