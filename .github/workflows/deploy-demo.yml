name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish demo
        run: dotnet publish -c Release -o _publish src/OpenHoldemEngine.Demo

      - name: Rewrite base href
        run: |
          sed -i 's|<base href="/" />|<base href="/OpenHoldemEngine/" />|' _publish/wwwroot/index.html
          grep -q '<base href="/OpenHoldemEngine/" />' _publish/wwwroot/index.html || (echo "Failed to rewrite base href in index.html" && exit 1)

      - name: Add .nojekyll
        run: touch _publish/wwwroot/.nojekyll

      - name: Create 404.html for SPA
        run: cp _publish/wwwroot/index.html _publish/wwwroot/404.html

      - name: Calculate artifact size
        id: size
        run: |
          SIZE=$(du -sh _publish/wwwroot/ | cut -f1)
          echo "artifact_size=$SIZE" >> $GITHUB_OUTPUT
          echo "### Published artifact size: $SIZE" >> $GITHUB_STEP_SUMMARY

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_publish/wwwroot'
          # Since v4 dotfiles are dropped unless asked for, and .nojekyll is one.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
