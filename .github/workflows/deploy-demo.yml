name: Deploy demo to GitHub Pages

# Called by release.yml for stable release tags (no `-` in the tag); workflow_dispatch redeploys an
# existing tag by hand: `gh workflow run deploy-demo.yml -f tag=v1.0.0`.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, for example v1.0.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, for example v1.0.0.
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The tag comes from inputs.tag, never from the run's own ref: on a manual dispatch that is the
      # branch the dispatch ran from.
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z or vX.Y.Z-suffix)."
            exit 1
          fi

      # Full history at the tag: MinVer reads the version from the tag at HEAD.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Check the tag exists
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG does not exist."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish demo
        run: dotnet publish -c Release -o _publish src/TabletopCardEngine.Demo

      - name: Rewrite base href
        run: |
          sed -i 's|<base href="/" />|<base href="/TabletopCardEngine/" />|' _publish/wwwroot/index.html
          grep -q '<base href="/TabletopCardEngine/" />' _publish/wwwroot/index.html || (echo "Failed to rewrite base href in index.html" && exit 1)

      - name: Add .nojekyll
        run: touch _publish/wwwroot/.nojekyll

      - name: Create 404.html for SPA
        run: cp _publish/wwwroot/index.html _publish/wwwroot/404.html

      - name: Calculate artifact size
        id: size
        run: |
          SIZE=$(du -sh _publish/wwwroot/ | cut -f1)
          echo "artifact_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "### Published artifact size: $SIZE" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_publish/wwwroot'
          # Since v4 dotfiles are dropped unless asked for, and .nojekyll is one.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
