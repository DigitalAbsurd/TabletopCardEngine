name: Publish to Docker Hub

# Called by release.yml once the GitHub Release exists; workflow_dispatch re-runs it by hand for an
# existing tag: `gh workflow run publish-docker.yml -f tag=v1.0.0-preview.1`.
#
# Builds the three images from the tag, logs in to Docker Hub, pushes each target, attests the image
# digest, checks the version label, and pushes the stable target tag for stable releases. The job runs
# only when the repository variable TCE_PUBLISH is `enabled`, which it is not. Setup: the
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, for example v1.0.0-preview.1.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, for example v1.0.0-preview.1.
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # The gate sits here rather than in the caller, so it holds for a manual dispatch too.
  publish-docker:
    if: ${{ vars.TCE_PUBLISH == 'enabled' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [sqlite, postgres, mssql]

    steps:
      # The tag comes from inputs.tag, never from the run's own ref: on a manual dispatch that is the
      # branch the dispatch ran from.
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z or vX.Y.Z-suffix)."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify the release tag signature
        run: bash eng/verify-tag.sh "${{ inputs.tag }}"

      - name: Check the tag exists
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG does not exist."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the ${{ matrix.target }} image
        id: push
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          docker build --target "${{ matrix.target }}" --build-arg VERSION="$version" -t "digitalabsurd/tabletopcardengine:$version-${{ matrix.target }}" .
          docker push "digitalabsurd/tabletopcardengine:$version-${{ matrix.target }}"

      - name: Get the image digest
        id: digest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          digest=$(docker inspect --format '{{ index .RepoDigests 0 }}' "digitalabsurd/tabletopcardengine:$version-${{ matrix.target }}" | sed 's/.*@//')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the image
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/digitalabsurd/tabletopcardengine
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: false

      - name: Check the image version label
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          label=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "digitalabsurd/tabletopcardengine:$version-${{ matrix.target }}")
          if [ "$label" != "$version" ]; then
            echo "::error::Image label is '$label', expected '$version'"
            exit 1
          fi

      - name: Push the stable target tag
        if: ${{ !contains(inputs.tag, '-') }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          docker tag "digitalabsurd/tabletopcardengine:$version-${{ matrix.target }}" "digitalabsurd/tabletopcardengine:${{ matrix.target }}"
          docker push "digitalabsurd/tabletopcardengine:${{ matrix.target }}"
