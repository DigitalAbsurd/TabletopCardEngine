name: Publish to nuget.org

# Called by release.yml once the GitHub Release exists; workflow_dispatch re-runs it by hand for an
# existing tag: `gh workflow run publish-nuget.yml -f tag=v1.0.0-preview.1`.
#
# Packs the libraries from the tag, verifies the packages and symbol packages, attests them, logs in
# with NuGet Trusted Publishing (OIDC via NuGet/login), and pushes to nuget.org. The job runs only
# when the repository variable TCE_PUBLISH is `enabled`, which it is not. Setup: register this
# workflow as a trusted publisher on nuget.org.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, for example v1.0.0-preview.1.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, for example v1.0.0-preview.1.
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # The gate sits here rather than in the caller, so it holds for a manual dispatch too.
  publish-nuget:
    if: ${{ vars.TCE_PUBLISH == 'enabled' }}
    runs-on: ubuntu-latest

    steps:
      # The tag comes from inputs.tag, never from the run's own ref: on a manual dispatch that is the
      # branch the dispatch ran from.
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z or vX.Y.Z-suffix)."
            exit 1
          fi

      # Full history at the tag: MinVer reads the version from the tag at HEAD.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify the release tag signature
        run: bash eng/verify-tag.sh "${{ inputs.tag }}"

      - name: Check the tag exists
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG does not exist."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Pack packages
        run: dotnet pack TabletopCardEngine.Packages.slnf -c Release -o artifacts

      - name: Verify packages
        env:
          TAG: ${{ inputs.tag }}
        run: bash eng/verify-packages.sh artifacts "${TAG#v}"

      - name: Verify symbol packages
        run: |
          nupkg_count=$(find artifacts -maxdepth 1 -name '*.nupkg' | wc -l)
          snupkg_count=$(find artifacts -maxdepth 1 -name '*.snupkg' | wc -l)
          if [ "$nupkg_count" -ne "$snupkg_count" ]; then
            echo "::error::Expected $nupkg_count .snupkg files (one per .nupkg), but found $snupkg_count."
            ls artifacts
            exit 1
          fi

      - name: Extract DLLs for attestation
        if: ${{ !github.event.repository.private }}
        run: |
          mkdir -p _attest
          for pkg in artifacts/*.nupkg; do
            unzip -j -o "$pkg" 'lib/net10.0/*.dll' -d _attest
          done

      - name: Attest packages
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*.nupkg,artifacts/*.snupkg,_attest/*.dll

      - name: Authenticate with NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: digitalabsurd

      - name: Push packages to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
