# git-cliff configuration. Run it through npx, pinned: npx --yes git-cliff@2.14.2 -o CHANGELOG.md
# See docs/release-process.md (Changelog).

[changelog]
header = """
# Changelog

This file is generated by git-cliff from the commit history. Do not edit it by hand: change `cliff.toml` or the commit subjects instead.
Versions follow [docs/versioning.md](docs/versioning.md).
"""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% set releases = commits | filter(attribute="group", value="release") %}\
{% if commits | length == releases | length %}
No changes since the previous version.
{% endif %}\
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}
### Breaking changes
{% for commit in breaking %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
{% if group != "release" %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
{% if not commit.breaking %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% endif %}\
{% endfor %}\
{% endif %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
    # Squash merges carry the pull request description after the subject: keep the subject only.
    { pattern = '(?s)\n.*$', replace = "" },
    { pattern = '\(#([0-9]+)\)\s*$', replace = "([#${1}](https://github.com/DigitalAbsurd/TabletopCardEngine/pull/${1}))" },
]
# The prose verbs below exist for the history that predates mandatory Conventional Commits.
commit_parsers = [
    # Kept, not skipped, so that a version with nothing but its release commit is still rendered
    # (git-cliff drops a version with no commits); the body hides the group.
    { message = '^chore\(release\)', group = "release" },
    { message = '^WIP', skip = true },
    { message = '^fix: merge conflicts$', skip = true },
    { message = '^Merge', skip = true },
    { message = '^feat', group = "<!-- 1 -->Added" },
    { message = '^(Add|Implement|Introduce|Serve|Support|Enable|Expose|Create|Publish)\b', group = "<!-- 1 -->Added" },
    { message = '^fix', group = "<!-- 2 -->Fixed" },
    { message = '^Fix\b', group = "<!-- 2 -->Fixed" },
    { message = '^(refactor|perf)', group = "<!-- 3 -->Changed" },
    { message = '^(Update|Move|Rename|Replace|Remove|Shorten|Group|Switch|Make|Use|Return|Reject|Accept|Map|Translate|Configure|Pick|Play|Gate|Verify|Run|Merge without|Save|Ignore|Stop|Serialize|Bump|Check|Let|Disable|Wrap|Commit|Freeze)\b', group = "<!-- 3 -->Changed" },
    { message = '^docs', group = "<!-- 4 -->Documentation" },
    { message = '^(Document|Record|Correct the|Correct public|List)\b', group = "<!-- 4 -->Documentation" },
    { message = '^(ci|build)', group = "<!-- 5 -->Build and CI" },
    { message = '^test', group = "<!-- 6 -->Tests" },
    { message = '^chore', group = "<!-- 7 -->Other" },
    { message = '.*', group = "<!-- 7 -->Other" },
]
