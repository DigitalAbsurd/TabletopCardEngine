services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-holdem}
      POSTGRES_DB: holdem
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d holdem
      interval: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      target: postgres
    image: tabletopcardengine:postgres
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Holdem: "Host=db;Database=holdem;Username=postgres;Password=${POSTGRES_PASSWORD:-holdem}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
