<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabletopCardEngine.Demo</title>
    <base href="/" />
    <script src="js/theme.js"></script>
    <script src="js/loading.js"></script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link href="TabletopCardEngine.Demo.styles.css" rel="stylesheet" />
    <link href="lib/prism/prism.min.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <!-- The mark is inlined, not loaded from favicon.svg, so it paints before any request. -->
        <div class="app-loading" role="status" aria-live="polite">
            <svg class="app-loading-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
                <rect width="512" height="512" fill="#16131F"/>
                <rect x="135.57" y="127" width="192.86" height="270" rx="19.29" fill="#FF5A3C" transform="rotate(-14 232 262)"/>
                <rect x="183.57" y="115" width="192.86" height="270" rx="19.29" fill="#F4F1EA" transform="rotate(8 280 250)"/>
                <path fill="#16131F" transform="rotate(188 280 250)" d="M338.60 220.70L299.36 220.70L299.36 310L260.81 310L260.81 220.70L221.40 220.70L221.40 190.00L338.60 190.00L338.60 220.70Z"/>
            </svg>
            <div class="app-loading-bar"><div class="app-loading-bar-fill"></div></div>
            <div class="app-loading-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something unexpected happened. Reloading is safe — your in-memory database will be reset, so you will lose the current game.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="lib/prism/prism.min.js"></script>
    <script src="lib/prism/prism-csharp.min.js"></script>
    <script src="js/download.js"></script>
</body>

</html>
