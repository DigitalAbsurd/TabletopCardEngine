<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenHoldemEngine.Demo</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="OpenHoldemEngine.Demo.styles.css" rel="stylesheet" />
    <link href="lib/prism/prism.min.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="lib/prism/prism.min.js"></script>
    <script src="lib/prism/prism-csharp.min.js"></script>

    <script>
        // Helper function for scrolling to latest entry (called by JS interop)
        window.scrollToLatestEntry = function (element) {
            if (!element) {
                return;
            }
            requestAnimationFrame(() => {
                const entries = element.querySelectorAll('.engine-call-entry');
                if (entries.length > 0) {
                    const lastEntry = entries[entries.length - 1];
                    lastEntry.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            });
        };
    </script>
</body>

</html>
