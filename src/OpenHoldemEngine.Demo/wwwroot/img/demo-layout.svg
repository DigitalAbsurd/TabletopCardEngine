<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <style>
      .header { font-size: 24px; font-weight: bold; fill: #1890ff; }
      .panel-title { font-size: 14px; font-weight: bold; fill: #333; }
      .panel-label { font-size: 12px; fill: #666; }
      .panel-bg { fill: #f5f5f5; stroke: #d9d9d9; stroke-width: 1; }
      .highlight { fill: #e6f7ff; stroke: #91d5ff; stroke-width: 1; }
      .card { fill: #fff; stroke: #bfbfbf; stroke-width: 1; }
      .suit-hearts { fill: #d9001b; }
      .suit-diamonds { fill: #d9001b; }
      .suit-clubs { fill: #000; }
      .suit-spades { fill: #000; }
      .text-white { fill: #fff; }
      .table-cell { fill: #fafafa; stroke: #e8e8e8; stroke-width: 0.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#fff"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="50" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
  <text x="20" y="35" class="header">OpenHoldemEngine Demo</text>
  <text x="1180" y="35" font-size="12" fill="#999" text-anchor="end">Three panels, one state</text>

  <!-- Main content area -->
  <g>
    <!-- Left panel: Poker Table -->
    <rect x="10" y="60" width="520" height="630" class="panel-bg"/>
    <text x="30" y="85" class="panel-title">🎰 Poker Table</text>
    <text x="30" y="105" class="panel-label">Live game visualization</text>

    <!-- Simplified table representation -->
    <ellipse cx="270" cy="280" rx="120" ry="90" fill="none" stroke="#52c41a" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="270" y="285" text-anchor="middle" font-size="12" fill="#52c41a">Community cards:</text>
    <text x="270" y="305" text-anchor="middle" font-size="11" fill="#52c41a">Flop, Turn, River</text>

    <!-- Player seats -->
    <g>
      <!-- Seat 1 -->
      <rect x="80" y="150" width="90" height="50" class="card"/>
      <text x="125" y="170" text-anchor="middle" font-size="12" font-weight="bold">Seat 1</text>
      <text x="125" y="190" text-anchor="middle" font-size="10" fill="#666">Stack: 1000</text>

      <!-- Seat 2 (dealer) -->
      <rect x="395" y="150" width="90" height="50" class="card"/>
      <rect x="395" y="150" width="90" height="50" fill="none" stroke="#faad14" stroke-width="2"/>
      <text x="440" y="170" text-anchor="middle" font-size="12" font-weight="bold">Seat 2</text>
      <text x="440" y="190" text-anchor="middle" font-size="10" fill="#666">Dealer</text>

      <!-- Seat 3 -->
      <rect x="237" y="420" width="90" height="50" class="card"/>
      <text x="282" y="440" text-anchor="middle" font-size="12" font-weight="bold">Seat 3</text>
      <text x="282" y="460" text-anchor="middle" font-size="10" fill="#666">To act...</text>
    </g>

    <!-- Pot display -->
    <rect x="210" y="360" width="120" height="40" fill="none" stroke="#1890ff" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="270" y="378" text-anchor="middle" font-size="12" font-weight="bold">Pot: $450</text>
    <text x="270" y="395" text-anchor="middle" font-size="10" fill="#666">Street: Flop</text>

    <!-- Action buttons -->
    <rect x="50" y="550" width="70" height="30" fill="#1890ff" rx="2"/>
    <text x="85" y="570" text-anchor="middle" class="text-white" font-size="12">Fold</text>

    <rect x="130" y="550" width="70" height="30" fill="#1890ff" rx="2"/>
    <text x="165" y="570" text-anchor="middle" class="text-white" font-size="12">Check</text>

    <rect x="210" y="550" width="70" height="30" fill="#52c41a" rx="2"/>
    <text x="245" y="570" text-anchor="middle" class="text-white" font-size="12">Raise</text>

    <rect x="290" y="550" width="70" height="30" fill="#faad14" rx="2"/>
    <text x="325" y="570" text-anchor="middle" class="text-white" font-size="12">All-in</text>

    <rect x="370" y="550" width="130" height="30" fill="#8c8c8c" rx="2"/>
    <text x="435" y="570" text-anchor="middle" class="text-white" font-size="12">Next Hand</text>

    <!-- Street indicator -->
    <text x="30" y="630" font-size="11" fill="#666">Street progression: Pre-Flop → Flop → Turn → River → Showdown</text>
  </g>

  <!-- Middle panel: Database Inspector -->
  <rect x="540" y="60" width="330" height="630" class="panel-bg"/>
  <text x="560" y="85" class="panel-title">🗄️ Database Inspector</text>
  <text x="560" y="105" class="panel-label">Physical SQLite schema</text>

  <!-- Table list -->
  <rect x="560" y="130" width="290" height="20" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="570" y="145" font-size="11" font-weight="bold">Tables:</text>

  <g font-size="10" fill="#666">
    <rect x="560" y="160" width="290" height="18" class="table-cell"/>
    <text x="570" y="173">✓ Game</text>

    <rect x="560" y="180" width="290" height="18" class="table-cell"/>
    <text x="570" y="193">✓ Hand</text>

    <rect x="560" y="200" width="290" height="18" class="table-cell"/>
    <text x="570" y="213">✓ HandAction</text>

    <rect x="560" y="220" width="290" height="18" class="table-cell"/>
    <text x="570" y="233">✓ HandDeckCard</text>

    <rect x="560" y="240" width="290" height="18" class="table-cell"/>
    <text x="570" y="253">✓ HandHoleCard</text>

    <rect x="560" y="260" width="290" height="18" class="table-cell"/>
    <text x="570" y="273">✓ HandPlayerEndState</text>

    <text x="570" y="295" font-weight="bold">Selected table: HandAction</text>

    <rect x="560" y="310" width="290" height="18" class="table-cell"/>
    <text x="570" y="323">Columns: 8 | Rows: 12</text>

    <text x="570" y="350" font-weight="bold">Recent rows:</text>

    <rect x="560" y="365" width="290" height="16" class="table-cell"/>
    <text x="570" y="377" font-size="9">(GameId, HandNo, No, SeatNo)</text>

    <rect x="560" y="383" width="290" height="16" class="table-cell"/>
    <text x="570" y="395" font-size="9">Street: "Flop" | ActionType: "Raise"</text>

    <rect x="560" y="401" width="290" height="16" class="table-cell"/>
    <text x="570" y="413" font-size="9">Amount: 300 | AddAmount: 200</text>

    <rect x="560" y="419" width="290" height="16" class="table-cell"/>
    <text x="570" y="431" font-size="9">Card format: "ah", "tc", "ks"...</text>
  </g>

  <text x="560" y="630" font-size="11" fill="#666" style="font-style: italic;">Highlights show which tables changed</text>
  <text x="560" y="645" font-size="11" fill="#666" style="font-style: italic;">after each action. No hidden state.</text>

  <!-- Right panel: Engine Calls -->
  <rect x="880" y="60" width="310" height="630" class="panel-bg"/>
  <text x="900" y="85" class="panel-title">📝 Engine Calls Log</text>
  <text x="900" y="105" class="panel-label">Exact C# code with syntax highlighting</text>

  <g font-size="9" fill="#333" font-family="'Courier New', monospace">
    <!-- Code snippet 1 -->
    <rect x="900" y="130" width="270" height="60" class="card"/>
    <text x="910" y="148" fill="#d73a49">var result = await</text>
    <text x="910" y="160" fill="#6f42c1">engine</text>
    <text x="940" y="160" fill="#24292e">.</text>
    <text x="946" y="160" fill="#005a9c">ApplyHoldemActionAsync</text>
    <text x="910" y="172" fill="#005a9c">    new HoldemActionPlayerAction</text>
    <text x="910" y="184" fill="#d9d9d9">        GameId: gameId,</text>

    <!-- Code snippet 2 -->
    <rect x="900" y="200" width="270" height="60" class="card"/>
    <text x="910" y="218" fill="#d73a49">var result = await</text>
    <text x="910" y="230" fill="#6f42c1">engine</text>
    <text x="910" y="242" fill="#005a9c">    ApplyHoldemActionAsync(</text>
    <text x="910" y="254" fill="#005a9c">        new HoldemActionFold(...)</text>

    <!-- Code snippet 3 -->
    <rect x="900" y="270" width="270" height="50" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
    <text x="910" y="283" fill="#856404" font-weight="bold">Failed: Game not found</text>
    <text x="910" y="298" fill="#856404" font-size="8">HoldemValidation_GameIdNotFound</text>

    <!-- Action buttons -->
    <rect x="900" y="330" width="130" height="25" fill="#1890ff" rx="2"/>
    <text x="965" y="347" text-anchor="middle" class="text-white" font-size="11">Copy Snippet</text>

    <rect x="1040" y="330" width="130" height="25" fill="#52c41a" rx="2"/>
    <text x="1105" y="347" text-anchor="middle" class="text-white" font-size="11">Copy Session</text>

    <!-- Features list -->
    <text x="900" y="375" font-size="10" font-weight="bold">Features:</text>
    <text x="900" y="395" font-size="10">✓ Syntax highlighting</text>
    <text x="900" y="415" font-size="10">✓ Copy each snippet</text>
    <text x="900" y="435" font-size="10">✓ Export whole session</text>
    <text x="900" y="455" font-size="10">✓ Failed calls visible</text>
    <text x="900" y="475" font-size="10">✓ Auto-scroll to newest</text>

    <text x="900" y="510" font-size="10" fill="#666" style="font-style: italic;">Take snippets and use them</text>
    <text x="900" y="525" font-size="10" fill="#666" style="font-style: italic;">directly in your own project.</text>
  </g>

  <!-- Bottom note -->
  <rect x="10" y="700" width="1180" height="0" fill="none"/>
  <text x="600" y="695" text-anchor="middle" font-size="11" fill="#999">
    These three panels stay synchronized as you play. The database is the single source of truth.
  </text>
</svg>
